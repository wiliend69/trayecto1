<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Rueda Nocturna</title>
  </head>
  <body class="bg-yellow-950 text-white min-h-screen flex items-center justify-center p-4">
    <main class="max-w-xl w-full bg-amber-800 p-8 rounded-2xl border border-amber-850 shadow-xl flex flex-col gap-5">
     <span class="self-start bg-orange-900 text-black-400 text-xs font-semibold uppercase  px-3 py-1 rounded-full">
        Nuevo · Jueves a sábado

      <h1 class="text-4xl font-extrabold tracking-tight text-white">

      </h1>

      <h2 class="text-lg text-slate-300 font-normal leading-relaxed">

      </h2>
       <div class="flex gap-6 my-2  py-4">
        <span class="text-xl font-bold text-white block">
          3 rutas
        </span>
        <span class="text-xl font-bold text-white block">
          Desde $55.000
        </span>
      </div>
      <button class="block w-full text-center bg-yellow-700 hover:bg-yellow-600 text-slate-950 font-bold py-3 px-6 rounded-xl transition-colors">Inscríbete</button>
    </main>
