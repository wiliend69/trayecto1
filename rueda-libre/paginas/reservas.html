<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Libre | Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
   <header class="shadow-sm sticky-top" style="background-color: #705844;">
       <nav class="navbar navbar-expand-md navbar-dark container py-3">
         <div class="container-fluid d-flex flex-row align-items-center justify-content-between p-0">
            <div class="d-flex align-items-center gap-2 text-white">
                <h1 class="h4 mb-0 fw-bold">Rueda Libre</h1>
                <img class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;" src="../img/istockphoto-543977438-612x612.jpg" alt="Rueda libre" >
            </div>
      
               <div class="flew-grow-0">
                <div class="navbar-nav gap-2 md-4 pt-md-0">
                    <a class="nav-link" href="paginas/tarifa.html">tarifas</a>
                    <a class="nav-link" href="../index.html">Inicio</a>
                    <a class="nav-link" href="prueba/catalogo-bootstrap.html">Flota</a>
                </div>
               </div>
         </div>
       </nav>

    </header>
  <main>
    <section class="reserva container py-5">
     <div class="table-responsive mx-auto  rounded-4 overflow-hidden" style="max-width: 600px;">
           <table class="caption-top text-center py-3 text-white fw-bold text-uppercase tracking-wide" style="background-color: #705844;"> 
            <caption class="caption-top text-center py-3 text-white fw-bold text-uppercase tracking-wide" style="background-color: #705844;">
                <h2 class="h4 mb-0">Reserva tu bicicleta</h2>
            </caption>
            <thead class="text-white" style="background-color: #8c735c;">
                <tr>
                    <th scope= "col" class="py-3 fw-semibold">Dia</th>
                    <th scope= "col" class="py-3 fw-semibold">Horario</th>
                </tr>
            </thead>
              <tbody style="background-color: #ffffff;">
                <tr>
                    <td class="py-3 fw-medium text-secondary">Lunes a Viernes</td>
                    <td class="py-3 text-dark fw-bold">7:00 am a 7:00 pm</td>
                </tr>
                <tr>
                    <td class="py-3 fw-medium text-secondary">Sábado, Domingo y festivos</td>
                    <td class="py-3 text-dark fw-bold">6:00 am a 2:00 pm</td>
                </tr>
            </tbody>
        </table>
     </div>
    </section>
        <form method="post">
             <fieldset>
            <fieldset>
                <legend>Tus datos</legend>
                <p>
                    <label for="nombre">*Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p>
                    <label for="docu">*Numero de documento</label>
                    <input type="number" id="docu" name="docu" minlength="6" maxlength="10" required>
                </p>
                <p>
                    <label for="correo">*Correo electronico:</label>
                    <input type="email" id="correo" name="correo" required>
                </p>
                <p>
                    <label for="celu">*Celular (Tiene que empezar por 3)</label>
                    <input type="tel" id="celu" name="celu"  pattern="3[0-9]{5,9}" required>
                </p>
            </fieldset>
            <fieldset>
                <legend>Tu alquiler</legend>
                
                  <p>
                      <label for="alqui">*Fecha de alquiler (Nov 1 - Dic 02 | 2026):</label>
                    <input type="date" id="alqui" name="alqui" min="2026-11-01" max="2026-12-02" required>
                  </p>
                
                  <p>
                      <label for="tipo">Tipo de bicicleta</label>
                    <select name="tipo" id="tipo" required>
                        <option value="urban">Urbana</option>
                        <option value="monta">Montaña</option>
                        <option value="elec">Electrica</option>
                    </select>
                  </p>
                  <p>
                    <label for="plan">Plan:</label><br>
                    <label>
                        <input type="radio" id="1-hora" name="plan" value="1-hora" required>
                        1 Hora
                    </label><br>
                    <label>
                        <input type="radio" id="medio-dia" name="plan" value="medio-dia" required>
                        Medio dia
                    </label><br>
                    <label>
                        <input type="radio" id="dia-com" name="plan" value="dia-com" required>
                        Dia completo
                    </label>
                  </p>
                    <p>
                        <label for="cantidad">Cantidad de bicicletas:</label>
                        <input type="number" id="cantidad" min="1" max="6" name="cantidad" required>
                    </p>
               
                  <p>
                      <label for="guia">Recorrido guiados:</label><br>
                    <label>
                        <input type="checkbox" id="rio">
                        Rios y Parques
                    </label><br>
                    <label>
                        <input type="checkbox" id="sabore">
                        Sabores de Rio
                    </label><br>
                    <label>
                        <input type="checkbox" id="reto">
                        Reto las palmas
                    </label><br>
                    <label>
                        <input type="checkbox" id="ninguno">
                        Ninguno
                    </label>
                  </p>
            </fieldset>
            <fieldset>
                <legend>Confirmacion</legend>
                <p>
                    <label for="comen">Comentarios (maximo 300 caracteres):</label><br>
                    <textarea name="comen" id="comen" maxlength="300" cols="40"></textarea>
                  </p>
                <label >
                    <input type="checkbox" name="cond" id="cond" required>
                    aceptación de las políticas de alquiler.
                </label>
                
            </fieldset>
            <button type="submit" name="boton" >Reservar</button>
        </fieldset>
        </form>
       
  </main><br>
    
    <footer class="text-center text-white py-4" style="background-color: #705844;">Rueda libre | hola@ruedalibre.example | 2026</footer>
    
</body>
</html>
